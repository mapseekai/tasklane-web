name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: stable
  HUGO_VERSION: latest
  GOWORK: off
  HUGO_MODULE_WORKSPACE: off
  HUGO_CACHEDIR: ${{ github.workspace }}/.hugo_cache

jobs:
  deploy:
    name: Build and deploy
    if: github.event_name == 'workflow_dispatch' || vars.CLOUDFLARE_PAGES_ENABLED == 'true'
    environment:
      name: cloudflare-pages
      url: ${{ steps.deploy.outputs.deployment-url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: go.sum

      - name: Install Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Install Dart Sass 1.105.2
        shell: bash
        run: |
          sass_archive="$RUNNER_TEMP/dart-sass-1.105.2-linux-x64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$sass_archive" \
            https://github.com/sass/dart-sass/releases/download/1.105.2/dart-sass-1.105.2-linux-x64.tar.gz
          echo "a530ee08d5792c80bdb9d9614b45fb58219c890cb42a280a80775f0af9c29582  $sass_archive" | sha256sum --check
          tar --extract --gzip --file "$sass_archive" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/dart-sass" >> "$GITHUB_PATH"

      - name: Record build tool versions
        run: |
          go version
          hugo version
          sass --version

      - name: Resolve deployment settings
        env:
          CONFIGURED_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
          CONFIGURED_SITE_URL: ${{ vars.CLOUDFLARE_SITE_URL }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          CF_PROJECT_NAME="${CONFIGURED_PROJECT_NAME:-${REPOSITORY_NAME}}"
          CF_SITE_URL="${CONFIGURED_SITE_URL:-https://${CF_PROJECT_NAME}.pages.dev/}"
          echo "CF_PROJECT_NAME=${CF_PROJECT_NAME}" >> "${GITHUB_ENV}"
          echo "CF_SITE_URL=${CF_SITE_URL}" >> "${GITHUB_ENV}"

      - name: Download OINK
        run: go mod download github.com/pgsty/oink

      - name: Build
        run: |
          hugo --cleanDestinationDir --gc --minify --environment production \
            --printPathWarnings --panicOnWarning \
            --baseURL "${CF_SITE_URL}"

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=${{ env.CF_PROJECT_NAME }} --branch=${{ github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
