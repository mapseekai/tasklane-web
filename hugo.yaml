title: tasklane
baseURL: https://mapseekai.github.io/tasklane-web/
defaultContentLanguage: zh
enableGitInfo: false
enableRobotsTXT: true
timeZone: Asia/Shanghai
hasCJKLanguage: true
languages:
  zh:
    label: 简体中文
    locale: zh-CN
    title: tasklane
    hasCJKLanguage: true
    params:
      description: 用于浏览器和 Node.js 的 JS/TS 后台计算任务库，管理 Worker、任务排队与并发。
menus:
  main:
    - name: Home
      identifier: home
      pageRef: /
      url: /
      weight: 10
    - name: Docs
      identifier: docs
      pageRef: /docs
      url: /docs/
      weight: 20
    - name: Blog
      identifier: blog
      pageRef: /blog
      url: /blog/
      weight: 30
markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
      wrapStandAloneImageWithinParagraph: false
  highlight:
    noClasses: false
outputs:
  home: [HTML, RSS, markdown, LLMS, NAVJSON]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]
params:
  offline_search: true
  mermaid:
    fontFamily: var(--font-body)
  github_repo: https://github.com/mapseekai/tasklane-web
  github_branch: main
  github_project_repo: https://github.com/mapseekai/tasklane
  logo: icons/logo.svg
  copyright:
    authors: tasklane contributors
    from_year: 2026
  ui:
    preset: slate
    preset_menu: false
    dark_mode: true
    section_index: cards
    blog_index: list
    sidebar_menu_foldable: true
    sidebar_icon_policy: none
    backlinks: true
    show_page_meta: false
module:
  imports:
    - path: github.com/pgsty/oink
  hugoVersion:
    extended: true
    min: 0.168.0
