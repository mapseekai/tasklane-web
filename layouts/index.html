{{ define "main" }}
<div class="tl-home">
  <section class="tl-hero" aria-labelledby="hero-title">
    <div class="tl-container tl-hero-grid">
      <div class="tl-hero-copy">
        <h1 id="hero-title">让耗时计算<br>在后台执行。</h1>
        <p class="tl-lead">tasklane 是用于浏览器和 Node.js 的 JS/TS 库：把你写的计算函数交给后台线程（Worker），并管理任务排队与并发。</p>
        <div class="tl-actions"><a class="tl-button tl-primary" href="{{ "docs/start/node/" | relURL }}">运行第一个任务</a><a class="tl-text-link" href="{{ "docs/" | relURL }}">先了解 tasklane</a></div>
        <div class="tl-install"><code>npm install @mapseekai/tasklane@0.2.0-beta.2</code></div>
      </div>
      <figure class="tl-flow" aria-label="页面提交坐标数组，tasklane 排队并选择 Worker，Worker 执行转换，页面收到结果">
        <div class="tl-flow-head"><span>以页面导入坐标为例</span><a href="{{ "docs/start/" | relURL }}">看运行步骤</a></div>
        <div class="tl-flow-row"><span>页面主线程</span><span>提交坐标数组</span></div>
        <div class="tl-flow-connector" aria-hidden="true"></div>
        <div class="tl-flow-admit"><span>tasklane</span><span>排队，选择空闲 Worker</span></div>
        <div class="tl-flow-workers"><span>Worker 后台线程</span><span>执行你的转换函数</span></div>
        <div class="tl-flow-connector" aria-hidden="true"></div>
        <div class="tl-flow-result"><span>页面主线程</span><span>收到结果，更新界面</span></div>
        <div class="tl-flow-foot"><span>空闲 Worker 可以继续处理后续任务</span></div>
      </figure>
    </div>
  </section>
  {{ partial "tasklane/home-sections.html" . }}
</div>
{{ end }}
