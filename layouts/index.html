{{ define "main" }}
<div class="tl-home">
  <section class="tl-hero" aria-labelledby="hero-title">
    <div class="tl-container tl-hero-grid">
      <div class="tl-hero-copy">
        <h1 id="hero-title">让 Worker 计算<br>有边界。</h1>
        <p class="tl-lead">用明确的资源预算与所有权，管理浏览器和 Node.js 并发任务。</p>
        <div class="tl-actions"><a class="tl-button tl-primary" href="{{ "docs/start/" | relURL }}">开始使用</a><a class="tl-text-link" href="{{ "docs/architecture/" | relURL }}">了解架构</a></div>
        <div class="tl-install"><code>npm install @mapseekai/tasklane@beta</code></div>
      </div>
      <figure class="tl-flow" aria-label="任务先排队，资源准入后在 Worker 执行，结果租约由消费端释放">
        <div class="tl-flow-head"><span>一次任务的生命周期</span><a href="{{ "docs/concepts/lifecycle/" | relURL }}">阅读契约</a></div>
        <div class="tl-flow-row"><span class="tl-machine">scope.enqueue()</span><span>排队，等待资源</span></div>
        <div class="tl-flow-connector" aria-hidden="true"></div>
        <div class="tl-flow-admit"><span>资源准入</span><code>input / scratch / output</code></div>
        <div class="tl-flow-workers"><span>Worker 执行</span><span>调用线程保持响应</span></div>
        <div class="tl-flow-connector" aria-hidden="true"></div>
        <div class="tl-flow-result"><span class="tl-machine">ResultLease</span><span>消费后 release()</span></div>
        <div class="tl-flow-foot"><span>归还结果额度，继续后续任务</span><span aria-hidden="true">↻</span></div>
      </figure>
    </div>
  </section>
  {{ partial "tasklane/home-sections.html" . }}
</div>
{{ end }}
